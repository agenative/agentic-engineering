# Session tabs + Option/Alt shortcuts (Terminal.app: Use Option as Meta key)

set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -g mouse on
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g escape-time 10
set -g focus-events on

# When a session is destroyed (e.g. typing `exit` in the last pane),
# switch this client to the most recently active remaining session
# instead of detaching from tmux entirely.
set -g detach-on-destroy off

# Status bar: sessions as tabs (index order matches Alt-, / Alt-.)
set -g status-position top
set -g status-interval 2
set -g status-style "bg=#1e1e2e,fg=#cdd6f4"
set -g status-left ""
set -g status-right ""
set -g status-justify centre
set -g status-format[0] "#[align=centre]#{S/i:#[range=session|#{session_id} #{?#{==:#{session_name},#{client_session}},fg=#1e1e2e bg=#a6e3a1 bold,fg=#cdd6f4 bg=#313244}] #S #[norange default] }"

# Pane border colors (active pane highlighted)
set -g pane-border-style "fg=#313244"
set -g pane-active-border-style "fg=#a6e3a1,bold"

# Window status colors in status bar
setw -g window-status-style "fg=#7f849c"
setw -g window-status-current-style "fg=#a6e3a1,bold"
setw -g window-status-activity-style "fg=#f9e2af"

# Pane border format (shows pane index on active pane)
set -g pane-border-format "#{?pane_active,#[fg=#a6e3a1 bold] #P ,#[fg=#313244] #P }"
set -g pane-border-status bottom

# Option/Alt shortcuts (requires Terminal > Settings > Keyboard > Use Option as Meta key)
bind -n M-, switch-client -p
bind -n M-. switch-client -n
bind -n M-r command-prompt -p "rename session:" "rename-session '%%'"
bind -n M-n command-prompt -p "new session name:" "new-session -A -s '%%'"
bind -n M-w kill-session
bind -n M-R source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"

# Pane splits (editor sense: vertical = side-by-side, horizontal = stacked)
bind -n M-i split-window -h -c "#{pane_current_path}"
bind -n M-l split-window -v -c "#{pane_current_path}"

# Pane focus: Alt-s then i/j/k/l (up/left/down/right)
# Return to root after each move so Alt-, / Alt-. keep working.
# Bind Meta second-keys too (holding Option sends M-*).
bind -n M-s switch-client -T pane-nav
bind -T pane-nav i select-pane -U \; switch-client -T root
bind -T pane-nav j select-pane -L \; switch-client -T root
bind -T pane-nav k select-pane -D \; switch-client -T root
bind -T pane-nav l select-pane -R \; switch-client -T root
bind -T pane-nav M-i select-pane -U \; switch-client -T root
bind -T pane-nav M-j select-pane -L \; switch-client -T root
bind -T pane-nav M-k select-pane -D \; switch-client -T root
bind -T pane-nav M-l select-pane -R \; switch-client -T root
# Session switch / destroy also works if still in pane-nav
bind -T pane-nav M-, switch-client -p \; switch-client -T root
bind -T pane-nav M-. switch-client -n \; switch-client -T root
bind -T pane-nav M-w kill-session

# Mouse highlight → macOS clipboard
# set-clipboard external needs a non-empty copy-command (pbcopy).
set -g set-clipboard external
set -g copy-command "pbcopy"
setw -g mode-keys vi

# Drag / double / triple click copy into pbcopy (not only the tmux buffer)
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode    MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi DoubleClick1Pane select-pane \; send-keys -X select-word \; run-shell -d 0.3 \; send-keys -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode    DoubleClick1Pane select-pane \; send-keys -X select-word \; run-shell -d 0.3 \; send-keys -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi TripleClick1Pane select-pane \; send-keys -X select-line \; run-shell -d 0.3 \; send-keys -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode    TripleClick1Pane select-pane \; send-keys -X select-line \; run-shell -d 0.3 \; send-keys -X copy-pipe-and-cancel "pbcopy"
