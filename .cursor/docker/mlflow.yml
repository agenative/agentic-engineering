# Standalone local MLflow for Cursor Agent tracing (agentic-engineering).
# Usage:
#   docker compose -f .cursor/docker/mlflow.yml up -d
#   docker compose -f .cursor/docker/mlflow.yml down
#
# Container: local_mlflow  |  Volume: local_mlflow_data  |  UI: http://127.0.0.1:5001
#

services:
  mlflow:
    container_name: local_mlflow
    image: ghcr.io/mlflow/mlflow:v3.12.0
    depends_on: []
    network_mode: host
    environment:
      MLFLOW_BACKEND_STORE_URI: sqlite:///data/mlflow.db
      MLFLOW_DEFAULT_ARTIFACT_ROOT: /data/mlartifacts
      MLFLOW_HOST: 127.0.0.1
      # The default is 5000, but that conflicts with AirPlay on Mac
      MLFLOW_PORT: 5001
      # Opt out of telemetry data https://github.com/mlflow/mlflow/issues/16944
      MLFLOW_DISABLE_TELEMETRY: "true"
      TZ:
    volumes:
      - local_mlflow_data:/data
    command: |
      /bin/bash -e -c "
        getent group 10001 >/dev/null || groupadd --gid 10001 mlflow
        getent passwd 10001 >/dev/null || useradd --uid 10001 --gid 10001 --shell /bin/bash --create-home mlflow

        mkdir -p /data
        chown -R 10001:10001 /data

        exec su -s /bin/bash -c \"mlflow server \
          --backend-store-uri $${MLFLOW_BACKEND_STORE_URI} \
          --default-artifact-root $${MLFLOW_DEFAULT_ARTIFACT_ROOT} \
          --host $${MLFLOW_HOST} \
          --port $${MLFLOW_PORT}\" mlflow"

volumes:
  local_mlflow_data:
    name: local_mlflow_data
